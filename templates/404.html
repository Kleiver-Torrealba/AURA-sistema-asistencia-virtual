<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | AURA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-dark:      #09090b;
            --card-dark:    #121216;
            --border-color: #22222a;
            --accent-blue:  #3b82f6;
            --accent-green: #1ed760;
            --text-main:    #ffffff;
            --text-dim:     #a1a1aa;
            --shadow-md:    0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(20, 25, 45, 0.8) 0%, var(--bg-dark) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-12px); }
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            max-width: 520px;

            /* Glassmorphism */
            background: rgba(18, 18, 22, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-md);
        }

        .error-icon {
            font-size: 4rem;
            color: var(--accent-blue);
            animation: float 3s ease-in-out infinite;
            margin-bottom: 24px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
        }

        .brand {
            margin-top: 40px;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: var(--text-dim);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">
            <i class="fa-solid fa-compass-drafting"></i>
        </div>

        <div class="error-code">404</div>

        <h1>Página no encontrada</h1>
        <p>La página que buscás no existe o fue movida.<br>
           Revisá la URL o volvé al inicio.</p>

        <a href="/" class="btn btn-primary">
            <i class="fa-solid fa-house"></i>
            Volver al inicio
        </a>

        <div class="brand">A U R A</div>
    </div>
</body>
</html>
